name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  build:
    name: Build (Debug)
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project Petrichor.xcodeproj \
            -scheme Petrichor \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  shell-tests:
    name: Shell tests
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run all shell test scripts
        run: |
          set -euo pipefail
          pass=0
          fail=0
          failed_tests=""
          for s in Scripts/test-*.sh; do
            name=$(basename "$s" .sh)
            if bash "$s" >/dev/null 2>&1; then
              pass=$((pass+1))
              echo "PASS  $name"
            else
              fail=$((fail+1))
              failed_tests="$failed_tests $name"
              echo "FAIL  $name"
            fi
          done
          echo ""
          echo "Summary: $pass passed, $fail failed"
          if [ "$fail" -ne 0 ]; then
            echo "Failed tests:$failed_tests"
            exit 1
          fi
