name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish unsigned release
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Install packaging tools
        run: brew install create-dmg

      - name: Build unsigned DMG
        id: build
        run: |
          set -euo pipefail

          tag_name="${GITHUB_REF_NAME}"
          Scripts/build-installer.sh --version "$tag_name" --local --universal

      - name: Prepare release notes
        run: |
          set -euo pipefail

          {
            printf 'Petrichor %s\n\n' "$GITHUB_REF_NAME"
            printf 'This release artifact is unsigned and not notarized.\n\n'
            printf '## 安装与首次打开\n\n'
            printf '将 Petrichor 拖入“应用程序”目录。如果提示“Petrichor 已损坏，无法打开”或无法验证开发者，确认下载来源可信后，在“终端”中运行：\n\n'
            printf '```bash\n'
            printf 'sudo xattr -r -d com.apple.quarantine /Applications/Petrichor.app\n'
            printf '```\n\n'
            printf '按提示输入 Mac 管理员密码（输入时不会显示字符），完成后重新打开 Petrichor。此命令会移除该应用的下载隔离属性；如果安装在其他位置，请替换命令中的应用路径。\n\n'
            printf 'SHA256 checksums:\n\n'
            printf '```text\n'
            cat build/*.sha256
            printf '```\n'
          } > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          assets=(build/*.dmg build/*.sha256)

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "Petrichor $GITHUB_REF_NAME" \
              --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --title "Petrichor $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
