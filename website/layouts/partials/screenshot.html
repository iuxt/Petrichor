{{ $original := resources.Get (printf "screenshots/%s.png" .name) }}
{{ $small := $original.Resize "800x webp q85" }}
{{ $large := $original.Resize "1600x webp q88" }}
<img src="{{ $large.RelPermalink }}" srcset="{{ $small.RelPermalink }} 800w, {{ $large.RelPermalink }} 1600w" sizes="{{ .sizes | default "(max-width: 1200px) 92vw, 1120px" }}" width="{{ $large.Width }}" height="{{ $large.Height }}" alt="{{ .alt }}" {{ if .eager }}fetchpriority="high"{{ else }}loading="lazy"{{ end }} decoding="async">
